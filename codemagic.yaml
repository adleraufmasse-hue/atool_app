workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.adleraufmasse.atool

    scripts:
      - name: Flutter packages laden
        script: |
          flutter pub get

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: CocoaPods installieren, falls Podfile vorhanden
        script: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
            cd ..
          else
            echo "Kein ios/Podfile vorhanden – überspringe pod install."
          fi

      - name: iOS Code Signing konfigurieren
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: ExportOptions prüfen
        script: |
          ls -la /Users/builder/export_options.plist
          cat /Users/builder/export_options.plist

      - name: iOS IPA bauen
        script: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${APP_VERSION%%+*}
          BUILD_NUMBER=${APP_VERSION##*+}
          echo "Building iOS version $BUILD_NAME ($BUILD_NUMBER)"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
