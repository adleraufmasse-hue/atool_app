workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.adleraufmasse.atool

    scripts:
      - name: Flutter packages laden
        script: |
          flutter pub get

      - name: CocoaPods installieren, falls Podfile vorhanden
        script: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
            cd ..
          else
            echo "Kein ios/Podfile vorhanden – überspringe pod install."
          fi

      - name: iOS Code Signing konfigurieren
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: iOS IPA bauen
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log